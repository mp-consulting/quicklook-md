name: QuickLookMD
options:
  bundleIdPrefix: com.mpconsulting
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4HWBUF2R8D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MarkdownRendering:
    path: Packages/MarkdownRendering
targets:
  QuickLookMD:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements", "Sample.md"]
      - path: App/Sample.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuickLook MD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Mickael Palma
    entitlements:
      path: App/QuickLookMD.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mpconsulting.QuickLookMD
      PRODUCT_NAME: QuickLook MD
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MarkdownRendering
      - target: QuickLookMDPreview
        embed: true
  QuickLookMDPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        excludes: ["*.entitlements"]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: Markdown Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - public.markdown
              - org.commonmark.markdown
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        # Lets the preview read images next to the Markdown file, not just the file itself.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mpconsulting.QuickLookMD.Preview
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: MarkdownRendering
