name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test renderer
        working-directory: Packages/MarkdownRendering
        run: swift test

      - name: Build app (ad-hoc signed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-release.sh 0.0.0

      - uses: actions/upload-artifact@v7
        with:
          name: QuickLook-MD-ci-${{ github.run_number }}
          path: dist/
          retention-days: 7
